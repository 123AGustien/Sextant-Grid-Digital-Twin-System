name: Deploy Sextant Grid Digital Twin to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify web application
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/style.css
          echo "web/index.html found"
          echo "web/app.js found"
          echo "web/style.css found"

      - name: Build Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R web/. _site/
          test -f _site/index.html
          echo "Pages site prepared from web/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4